g').scrollHeight}function stop(msg){active=false;clearInterval(timer);$('word').disabled=true;$('send').disabled=true;$('hint').textContent=msg;if(score>Number(localStorage.wordBest||0)){localStorage.wordBest=score;$('best').textContent=score}}function tick(){remaining=20;$('time').textContent=remaining;clearInterval(timer);timer=setInterval(()=>{remaining--;$('time').textContent=remaining;if(remaining<=0)stop('⏰ 시간 초과! 새 게임으로 재도전하세요.')},1000)}function start(){used=new Set();score=0;active=true;$('score').textContent=0;$('log').innerHTML='';$('word').disabled=false;$('send').disabled=false;last='사과';used.add(last);bubble('🤖 사과');$('hint').textContent='「과」로 시작하는 단어를 입력하세요';$('word').value='';$('word').focus();tick()}function submit(){if(!active)return;let w=$('word').value.trim();if(w.length<2){$('hint').textContent='두 글자 이상 입력하세요!';return}if(!pool.includes(w)){$('hint').textContent='📚 내장 단어 목록에 없는 단어예요. 다른 단어를 시도하세요.';return}if(used.has(w)){$('hint').textContent='이미 사용한 단어예요!';return}if(w[0]!==last.at(-1)){$('hint').textContent='「'+last.at(-1)+'」로 시작해야 해요!';return}used.add(w);bubble('🙋 '+w,true);score+=10;$('score').textContent=score;$('word').value='';const next=pool.filter(x=>!used.has(x)&&x[0]===w.at(-1));if(!next.length){stop('🏆 승리! 컴퓨터가 이어갈 단어를 찾지 못했어요.');return}let answer=next[Math.floor(Math.random()*next.length)];used.add(answer);last=answer;bubble('🤖 '+answer);$('hint').textContent='「'+answer.at(-1)+'」로 시작하세요!';tick()}$('start').onclick=start;$('send').onclick=submit;$('word').onkeydown=e=>{if(e.key==='Enter')submit()};$('best').textContent=localStorage.wordBest||0;<\/script></body></html>\n", "2": "<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>스도쿠 | 말잇GO</title><style>body{background:#0d1428;color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif;margin:0}.wrap{max-width:630px;margin:auto;padding:20px}a{color:#9cf5d3;text-decoration:none}.bar{display:flex;justify-content:space-between;align-items:center}.board{display:grid;grid-template-columns:repeat(9,1fr);border:3px solid #9df5d1;border-radius:8px;overflow:hidden;margin:20px 0}.cell{aspect-ratio:1;border:1px solid #34445d;background:#182640;color:#fff;font-size:clamp(16px,4vw,25px);cursor:pointer;padding:0}.cell:nth-child(3n){border-right:2px solid #8ca5c2}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid #8ca5c2}.cell.fixed{color:#9df5d1;font-weight:900}.cell.selected{background:#365f79}.cell.wrong{color:#ff8c9b}.numbers{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.numbers button{padding:12px 0;border:0;border-radius:9px;background:#344867;color:#fff;font-weight:900;cursor:pointer}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}select,button.action{background:#9df5d1;color:#15253a;border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}p{color:#b8c5db}#message{min-height:25px}</style></head><body><div class=\"wrap\"><div class=\"bar\"><a href=\"index.html\">← 홈</a><strong>🧩 스도쿠</strong><a href=\"3.html\">다음 →</a></div><h1>숫자로 머리 풀기</h1><p>가로·세로·3×3 칸에 1~9가 한 번씩! 칸을 선택하고 숫자를 누르세요.</p><div class=\"tools\"><select id=\"level\"><option value=\"35\">쉬움</option><option value=\"45\">보통</option><option value=\"54\">어려움</option></select><button class=\"action\" id=\"new\">새 퍼즐</button><button class=\"action\" id=\"check\">정답 확인</button></div><div id=\"board\" class=\"board\"></div><div id=\"numbers\" class=\"numbers\"></div><p id=\"message\" aria-live=\"polite\"></p></div><script>let solution=[],puzzle=[],selected=0,fixed=[];const $=x=>document.getElementById(x);function shuffled(a){return a.sort(()=>Math.random()-.5)}function make(){let seed=[1,2,3,4,5,6,7,8,9],bands=shuffled([0,1,2]),stacks=shuffled([0,1,2]),rows=bands.flatMap(b=>shuffled([0,1,2]).map(r=>b*3+r)),cols=stacks.flatMap(b=>shuffled([0,1,2]).map(c=>b*3+c)),nums=shuffled(seed.slice());solution=rows.flatMap(r=>cols.map(c=>nums[(r*3+Math.floor(r/3)+c)%9]));puzzle=solution.slice();shuffled(Array.from({length:81},(_,i)=>i)).slice(0,Number($('level').value)).forEach(i=>puzzle[i]=0);fixed=puzzle.map(Boolean);selected=0;$('message').textContent='퍼즐 준비 완료!';render()}function render(){let b=$('board');b.innerHTML='';puzzle.forEach((v,i)=>{let e=document.createElement('button');e.className='cell'+(fixed[i]?' fixed':'')+(selected===i?' selected':'');e.textContent=v||'';e.onclick=()=>{selected=i;render()};b.append(e)})}function set(n){if(fixed[selected])return;puzzle[selected]=n;render();if(puzzle.every((v,i)=>v===solution[i]))$('message').textContent='🎉 완벽해요! 스도쿠 성공!'}$('numbers').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫'].map(n=>'<button data-n=\"'+n+'\">'+n+'</button>').join('');$('numbers').onclick=e=>{if(e.target.dataset.n)set(e.target.dataset.n==='⌫'?0:Number(e.target.dataset.n))};$('new').onclick=make;$('check').onclick=()=>{let wrong=0;puzzle.forEach((v,i)=>{let e=$('board').children[i];if(v&&v!==solution[i]){e.classList.add('wrong');wrong++}});$('message').textContent=wrong?'❗ 틀린 칸 '+wrong+'개를 빨간색으로 표시했어요.':'👍 입력한 숫자는 모두 맞아요!'};document.addEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key))set(+e.key);if(e.key==='Backspace'||e.key==='Delete')set(0)});make();<\/script></body></html>\n", "3": "<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>순발력 챌린지 | 말잇GO</title><style>body{background:#0d1428;color:#f5f8ff;font-family:system-ui,'Malgun Gothic',sans-serif;margin:0}.wrap{max-width:700px;margin:auto;padding:22px}a{color:#9bf6d1;text-decoration:none}.bar{display:flex;justify-content:space-between}.stats{display:flex;gap:12px}.stats div{flex:1;background:#243452;padding:17px;border-radius:14px;text-align:center}.stats strong{font-size:30px;color:#9bf6d1}.field{height:min(55vh,430px);min-height:310px;background:linear-gradient(140deg,#1b2a49,#18243a);border:2px solid #344967;border-radius:24px;position:relative d('gameframe');function navigate(){const id=location.hash.match(/^#game([123])$/)?.[1];document.body.classList.toggle('playing',!!id);document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.game===id));if(id){if(frame.dataset.current!==id){frame.srcdoc=games[id];frame.dataset.current=id;}window.scrollTo(0,0);}else{frame.removeAttribute('srcdoc');frame.dataset.current='';}}document.getElementById('back').onclick=()=>{location.hash='';navigate()};window.addEventListener('hashchange',navigate);navigate();</script></body></html>
