<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143dff"><title>천안의 산길 | 웹 프레젠테이션</title><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#fff;background:#07164d}*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;cursor:pointer}header{height:66px;position:fixed;z-index:20;inset:0 0 auto;display:flex;align-items:center;gap:18px;padding:0 26px;background:rgba(4,18,72,.88);backdrop-filter:blur(18px);border-bottom:1px solid #ffffff25}.brand{font-weight:800;letter-spacing:-.04em;white-space:nowrap}.brand small{display:block;font-size:10px;letter-spacing:.13em;color:#aabfff}.nav{display:flex;gap:4px;overflow:auto;scrollbar-width:none;margin-left:auto}.nav button{border:0;background:transparent;color:#b6c8ff;padding:10px 12px;border-radius:9px;font-size:12px;white-space:nowrap}.nav button.active,.nav button:hover{background:#ffffff25;color:white}.stage{height:100dvh;display:flex;align-items:center;justify-content:center;padding:82px 55px 76px;background:radial-gradient(circle at 70% 40%,#1d45b8,#07164d 68%)}.slide{position:relative;width:min(100%,calc((100dvh - 165px)*16/9));aspect-ratio:16/9;box-shadow:0 30px 90px #0008;overflow:hidden;background:#143dff}.slide img{display:block;width:100%;height:100%;object-fit:contain}.slide.enter-next{animation:next .6s cubic-bezier(.2,.8,.2,1)}.slide.enter-prev{animation:prev .6s cubic-bezier(.2,.8,.2,1)}@keyframes next{from{opacity:.2;transform:translateX(55px) scale(.97)}to{opacity:1;transform:none}}@keyframes prev{from{opacity:.2;transform:translateX(-55px) scale(.97)}to{opacity:1;transform:none}}.arrow{position:fixed;z-index:10;top:50%;transform:translateY(-50%);width:44px;height:54px;background:#ffffff1b;color:white;border:1px solid #ffffff45;border-radius:13px;font-size:28px}.arrow:hover{background:#ffffff44}.left{left:12px}.right{right:12px}footer{position:fixed;bottom:0;left:0;right:0;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#07164de8;border-top:1px solid #ffffff25;gap:12px}.progress{height:3px;position:absolute;left:0;top:0;background:#fff;transition:width .5s}.counter{font-size:13px;color:#d2dcff;font-variant-numeric:tabular-nums}.actions{display:flex;gap:8px}.actions button{background:#ffffff16;border:1px solid #ffffff30;color:white;padding:9px 13px;border-radius:9px;font-size:12px}.actions button:hover{background:#ffffff30}.dots{display:flex;gap:7px}.dots button{width:7px;height:7px;border:0;padding:0;border-radius:20px;background:#8fa6e3;transition:all .3s}.dots button.active{width:25px;background:white}.drawer{position:fixed;z-index:30;right:0;top:66px;bottom:62px;width:min(420px,100vw);background:#071b59f7;backdrop-filter:blur(20px);border-left:1px solid #ffffff30;padding:25px;overflow:auto;transform:translateX(105%);transition:transform .3s}.drawer.open{transform:none}.drawer h2{margin-top:0}.drawer p{white-space:pre-wrap;font-size:14px;line-height:1.75;border-bottom:1px solid #ffffff25;padding-bottom:12px}.hint{position:absolute;bottom:10px;left:14px;font-size:10px;color:#fff9;background:#0005;padding:5px 8px;border-radius:5px}@media(max-width:800px){header{height:58px;padding:0 12px;gap:7px}.brand{font-size:13px}.brand small{font-size:8px}.nav button{padding:8px;font-size:11px}.stage{padding:72px 6px 95px}.slide{width:100%}.arrow{top:auto;bottom:68px;transform:none;width:42px;height:40px}.left{left:10px}.right{right:10px}footer{height:58px;padding:0 62px}.dots{display:none}.actions button{padding:8px;font-size:11px}.drawer{top:58px;bottom:58px}.hint{display:none}}@media(prefers-reduced-motion:reduce){.slide.enter-next,.slide.enter-prev{animation:none}}
</style></head><body><header><div class="brand"><small>CHEONAN MOUNTAIN GUIDE</small>천안의 산길</div><nav class="nav" id="nav" aria-label="슬라이드 탐색"></nav></header><main class="stage"><div class="slide" id="slide"><img id="image" src="assets/slide-1.png" alt="천안 산길 프레젠테이션 1번 슬라이드"><span class="hint">← → 키보드 · 마우스 휠 · 터치로 이동</span></div></main><button class="arrow left" id="prev" aria-label="이전 슬라이드">‹</button><button class="arrow right" id="next" aria-label="다음 슬라이드">›</button><footer><div class="counter" id="counter">01 / 10</div><div class="dots" id="dots"></div><div class="actions"><button id="notes">슬라이드 내용</button><button id="fullscreen">⛶ 전체화면</button></div><div class="progress" id="progress"></div></footer><aside class="drawer" id="drawer" aria-label="슬라이드 원문"><h2>슬라이드 내용</h2><div id="copy"></div></aside><script>
const labels=['시작','산행 선택','광덕산','태조산','태학산','흑성산','성거산·은석산','도심 산책','안전 수칙','마무리'];let current=0,content=[],busy=false,touchX=0;const $=id=>document.getElementById(id);fetch('slides.json').then(r=>r.json()).then(d=>{content=d;render()}).catch(()=>{});labels.forEach((name,i)=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>go(i);$('nav').append(b);let dot=document.createElement('button');dot.setAttribute('aria-label',`${i+1}번 슬라이드`);dot.onclick=()=>go(i);$('dots').append(dot)});function render(dir=1){$('image').src=`assets/slide-${current+1}.png`;$('image').alt=`${labels[current]}: ${current+1}번 슬라이드`;$('counter').textContent=`${String(current+1).padStart(2,'0')} / 10`;$('progress').style.width=`${(current+1)*10}%`;[...$('nav').children].forEach((b,i)=>{b.classList.toggle('active',i===current);if(i===current)b.scrollIntoView({block:'nearest',inline:'nearest'})});[...$('dots').children].forEach((b,i)=>b.classList.toggle('active',i===current));$('prev').disabled=current===0;$('next').disabled=current===9;$('prev').style.opacity=current===0?'.25':'1';$('next').style.opacity=current===9?'.25':'1';$('copy').replaceChildren();(content[current]||[]).forEach(t=>{let p=document.createElement('p');p.textContent=t;$('copy').append(p)});let s=$('slide');s.classList.remove('enter-next','enter-prev');void s.offsetWidth;s.classList.add(dir>=0?'enter-next':'enter-prev');location.hash=`slide-${current+1}`;document.title=`${labels[current]} | 천안의 산길`};function go(n){n=Math.max(0,Math.min(9,n));if(n===current)return;let dir=n-current;current=n;render(dir)}$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('notes').onclick=()=>{$('drawer').classList.toggle('open');$('notes').textContent=$('drawer').classList.contains('open')?'내용 닫기':'슬라이드 내용'};$('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Escape')$('drawer').classList.remove('open')});let wheelLock=false;window.addEventListener('wheel',e=>{if(e.target.closest('.drawer')||Math.abs(e.deltaY)<15||wheelLock)return;wheelLock=true;go(current+(e.deltaY>0?1:-1));setTimeout(()=>wheelLock=false,750)},{passive:true});$('slide').addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});$('slide').addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>45)go(current+(dx<0?1:-1))},{passive:true});const start=Number(location.hash.match(/slide-(\d+)/)?.[1]);if(start>=1&&start<=10)current=start-1;render();
</script></body></html>
